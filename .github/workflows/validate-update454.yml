name: Validate VCollector update454
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-update454.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build corrected installer
        run: python3 qa/build-update454.py
      - name: Validate existing allowed paths and branding
        run: php -d display_errors=1 -d error_reporting=32767 qa/update454-test.php
      - name: Return validated public installer
        run: python3 -c "import pathlib; print('VC454_JSON '+pathlib.Path('installatie/update454.json').read_text())"
