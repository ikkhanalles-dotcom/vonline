name: Validate VCollector update453
on:
  push:
    paths:
      - 'installatie/update453.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check installer and branding regressions
        run: php -d display_errors=1 -d error_reporting=32767 qa/update453-test.php
